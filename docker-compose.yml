services:
  redis:
    image: redis:7-alpine
    container_name: web-crawler-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    profiles:
      - local
      - full

volumes:
  redis_data:
    driver: local